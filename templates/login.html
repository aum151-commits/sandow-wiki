{% extends "base.html" %}
{% block title %}Вход — Лига Сандов{% endblock %}
{% block content %}
<div class="login-wrap">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="" width="64" height="64" style="margin-bottom:12px">
  <span class="eyebrow" style="text-align:center">Отдел продаж</span>
  <h1>Лига Сандов</h1>
  <p style="color:var(--muted)">прокачивай навыки</p>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" required autofocus autocapitalize="off">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <div class="password-row">
          <input type="text" id="password" name="password" required
            autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password">
          <button type="button" class="btn secondary" id="togglePassword">Скрыть</button>
        </div>
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>
  <p style="margin-top:14px"><a href="{{ url_for('register') }}">Нет аккаунта — зарегистрироваться</a></p>
</div>
<script>
document.getElementById('togglePassword').addEventListener('click', function () {
  const f = document.getElementById('password');
  const show = f.type === 'password';
  f.type = show ? 'text' : 'password';
  this.textContent = show ? 'Скрыть' : 'Показать';
});
</script>
{% endblock %}
