{% extends "base.html" %}
{% block title %}Вход — Сандов Фитнес{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1>Сандов Фитнес</h1>
  <p style="color:var(--muted)">База знаний и обучение</p>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="name">Как вас записать (для истории правок)</label>
        <input type="text" id="name" name="name" placeholder="Например: Ольга">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
