{% extends "base.html" %}
{% block title %}Вход — Сандов Фитнес{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1>Сандов Фитнес</h1>
  <p style="color:var(--muted)">Обучение и база знаний</p>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" required autofocus autocapitalize="off">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>
  <p style="margin-top:14px"><a href="{{ url_for('register') }}">Нет аккаунта — зарегистрироваться</a></p>
</div>
{% endblock %}
