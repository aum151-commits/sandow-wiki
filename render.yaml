# База знаний «Сандов Фитнес». Контент хранится не здесь, а в отдельном
# приватном репозитории через GitHub API (github_store.py) — секреты в
# коде отсутствуют, репозиторий с приложением можно держать публичным.
services:
  - type: web
    name: sandow-wiki
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: GITHUB_TOKEN_WORKFLOW
        sync: false
      - key: WIKI_REPO
        sync: false
      - key: WIKI_PATH
        sync: false
      - key: WIKI_USERS_PATH
        sync: false
      - key: WIKI_PROGRESS_PATH
        sync: false
      - key: TRAINER_URL
        value: https://sandow-voice-trainer.onrender.com
      - key: TRAINER_USER
        sync: false
      - key: TRAINER_PASSWORD
        sync: false
      - key: CERT_SCORE_THRESHOLD
        value: "0.7"
