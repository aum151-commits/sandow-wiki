<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Сандов Фитнес{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="" width="28" height="28">
    Сандов Фитнес
  </a>
  {% if current_user %}
  <nav>
    <a href="{{ url_for('home') }}">Главная</a>
    <a href="{{ url_for('course_list') }}">Обучение</a>
    <a href="{{ url_for('wiki_list') }}">База знаний</a>
    <a href="{{ url_for('profile') }}">Профиль</a>
    {% if current_user_is_admin %}<a href="{{ url_for('admin_users') }}">Сотрудники</a>{% endif %}
    <a href="{{ url_for('logout') }}">Выйти</a>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
