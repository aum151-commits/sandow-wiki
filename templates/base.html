<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  var saved = localStorage.getItem('sandow-theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
})();
</script>
<title>{% block title %}Лига Сандов{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="theme-color" content="#0B0906">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="" width="28" height="28">
    Лига Сандов
  </a>
  <div style="display:flex; align-items:center; flex-wrap:wrap; gap:10px">
    {% if current_user %}
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Меню">☰</button>
    <nav id="mainNav">
      <a href="{{ url_for('home') }}">Главная</a>
      <a href="{{ url_for('course_list') }}">Обучение</a>
      <a href="{{ url_for('wiki_list') }}">База знаний</a>
      <a href="{{ trainer_url }}" target="_blank" rel="noopener">Тренажёр звонков</a>
      <a href="{{ url_for('profile') }}">Профиль</a>
      {% if current_user_is_admin %}<a href="{{ url_for('admin_users') }}">Сотрудники</a>{% endif %}
      <a href="{{ url_for('logout') }}">Выйти</a>
    </nav>
    {% endif %}
    <button type="button" class="theme-toggle" id="themeToggle">Светлая тема</button>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
(function () {
  var navToggle = document.getElementById('navToggle');
  var nav = document.getElementById('mainNav');
  if (navToggle && nav) {
    navToggle.addEventListener('click', function () {
      nav.classList.toggle('open');
    });
  }
})();
(function () {
  var btn = document.getElementById('themeToggle');
  function label() {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    btn.textContent = isLight ? 'Тёмная тема' : 'Светлая тема';
  }
  label();
  btn.addEventListener('click', function () {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('sandow-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('sandow-theme', 'light');
    }
    label();
  });
})();
</script>
</body>
</html>
