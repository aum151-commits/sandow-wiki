{% extends "base.html" %}
{% block title %}Регистрация — Лига Сандов{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1>Регистрация</h1>
  <p style="color:var(--muted)">Личный вход — чтобы прогресс по урокам считался за вами</p>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="display_name">Ваше имя</label>
        <input type="text" id="display_name" name="display_name" placeholder="Например: Ольга" required>
      </div>
      <div class="field">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" placeholder="латиницей, например anna25" required autocapitalize="off" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <div class="password-row">
          <input type="password" id="password" name="password" required minlength="6"
            autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="new-password">
          <button type="button" class="btn secondary" id="togglePassword">Показать</button>
        </div>
      </div>
      <div class="field">
        <label for="invite">Код приглашения</label>
        <input type="text" id="invite" name="invite" placeholder="выдаётся администратором клуба" required
          autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <button type="submit">Зарегистрироваться</button>
    </form>
  </div>
  <p style="margin-top:14px"><a href="{{ url_for('login') }}">Уже есть аккаунт — войти</a></p>
</div>
<script>
document.getElementById('togglePassword').addEventListener('click', function () {
  const f = document.getElementById('password');
  const show = f.type === 'password';
  f.type = show ? 'text' : 'password';
  this.textContent = show ? 'Скрыть' : 'Показать';
});
</script>
{% endblock %}
